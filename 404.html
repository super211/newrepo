<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found — UOB IT PMO</title>

<!-- Same inline data-URI favicon as index.html, so this page also avoids a /favicon.ico 404. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23123a6b'/%3E%3Crect x='7' y='8' width='4' height='16' rx='1' fill='%23e3eefa'/%3E%3Crect x='14' y='8' width='4' height='11' rx='1' fill='%237fb3e0'/%3E%3Crect x='21' y='8' width='4' height='7' rx='1' fill='%231f6fb2'/%3E%3C/svg%3E">

<style>
:root {
  --blue-900: #0b2545;
  --blue-800: #123a6b;
  --blue-600: #1f6fb2;
  --blue-700: #17508f;
  --blue-100: #e3eefa;
  --ink: #16202e;
  --ink-mute: #6f7d8f;
  --line: #d7dee8;
  --surface: #ffffff;
  --canvas: #eef2f7;
  --s-2: 8px;
  --s-3: 12px;
  --s-4: 16px;
  --s-5: 24px;
  --radius: 8px;
  --radius-sm: 5px;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial,
          "Noto Sans", "PingFang SC", "Microsoft YaHei", sans-serif;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: var(--s-5);
  font-family: var(--font);
  font-size: 14px;
  line-height: 1.5;
  color: var(--ink);
  background: var(--canvas);
}

.panel {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: 0 6px 20px rgba(11, 37, 69, .12);
  max-width: 520px;
  width: 100%;
  overflow: hidden;
}

.panel-head {
  background: linear-gradient(180deg, var(--blue-900), var(--blue-800));
  color: #fff;
  padding: var(--s-4) var(--s-5);
  display: flex;
  align-items: baseline;
  gap: var(--s-2);
}
.panel-head .rule {
  width: 3px;
  align-self: stretch;
  min-height: 24px;
  background: var(--blue-600);
  border-radius: 2px;
}
.panel-head strong { font-size: 18px; letter-spacing: .3px; }
.panel-head span {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 1.4px;
  color: var(--blue-100);
}

.panel-body { padding: var(--s-5); }

h1 {
  margin: 0 0 var(--s-3);
  font-size: 20px;
  color: var(--blue-900);
}

.code {
  display: inline-block;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: .6px;
  background: var(--blue-100);
  color: var(--blue-800);
  border-radius: 999px;
  padding: 2px 10px;
  margin-bottom: var(--s-3);
}

p { margin: 0 0 var(--s-4); color: var(--ink-mute); }

a.btn {
  display: inline-block;
  background: var(--blue-600);
  color: #fff;
  text-decoration: none;
  font-weight: 600;
  border-radius: var(--radius-sm);
  padding: var(--s-2) var(--s-4);
}
a.btn:hover { background: var(--blue-700); }
a.btn:focus-visible { outline: 2px solid #0f62d6; outline-offset: 2px; }
</style>
</head>

<body>
<main class="panel">
  <div class="panel-head">
    <span class="rule" aria-hidden="true"></span>
    <strong>UOB IT PMO</strong>
    <span>Project Kanban</span>
  </div>

  <div class="panel-body">
    <p class="code">Error 404</p>
    <h1>That page doesn’t exist</h1>
    <p>
      This demo site has a single page — the Kanban board. Any other address, including
      links to saved board state, will land here, because the board keeps no data between visits.
    </p>
    <!-- Absolute project-site path: correct even when the missing URL was several levels deep. -->
    <a class="btn" href="/newrepo/">Back to the board</a>
  </div>
</main>
</body>
</html>
